name: ingest

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron is best-effort and can be delayed
    # or skipped under load — ingestion is idempotent, so drift is harmless.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Never let a slow run overlap the next scheduled one.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest FAA NAS status
        run: python -m ingest.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
