name: ingest

on:
  schedule:
    # Kept as a low-cost fallback only. Measured reliability of this
    # trigger alone: ~7 runs in 22.4h against a declared */5 * * * *
    # cron (avg gap 224min, worst 304min) — GitHub Actions' `schedule`
    # event runs on a shared best-effort queue, not a dedicated timer.
    # Primary scheduling is now a Cloudflare Worker Cron Trigger (see
    # ../../worker/) that calls workflow_dispatch below on a reliable
    # clock. Ingestion is idempotent, so if this fallback ALSO fires,
    # it's a harmless no-op — see DEPLOY.md.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Never let a slow run overlap the next scheduled one.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest FAA NAS status
        run: python -m ingest.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
