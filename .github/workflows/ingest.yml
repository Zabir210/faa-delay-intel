name: ingest

on:
  # PAUSED 2026-09-28: GitHub account locked for a billing issue — every
  # dispatched run fails in ~2s before any code runs. Schedule trigger
  # commented out so nothing keeps hitting the locked account. The
  # Cloudflare Worker cron (../../worker/) is also paused (crons: []).
  # Re-enable both once the account is unlocked and a manual
  # workflow_dispatch succeeds.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Never let a slow run overlap the next scheduled one.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest FAA NAS status
        run: python -m ingest.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
