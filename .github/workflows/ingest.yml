name: ingest

on:
  # RETIRED 2026-10-08: ingestion now runs entirely in the Cloudflare Worker
  # (worker/src/), every 5 minutes, writing straight to Neon. This workflow
  # is kept only as a manual fallback (`gh workflow run ingest.yml`) and has
  # no schedule. Do not re-add a schedule: two writers would race on
  # delay_events (the Worker serialises with advisory locks; this doesn't).
  workflow_dispatch:

concurrency:
  # Never let a slow run overlap the next scheduled one.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest FAA NAS status
        run: python -m ingest.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
